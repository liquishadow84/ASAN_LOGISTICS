# /etc/nginx/sites-available/asana-logistics  — set "trustProxy": true (or IFA_TRUST_PROXY=1) on the server
server {
    listen 443 ssl http2;
    server_name atlas.example.ir;
    ssl_certificate     /etc/letsencrypt/live/atlas.example.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atlas.example.ir/privkey.pem;
    client_max_body_size 40m;            # maxUploadMB (25) × base64 overhead
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
server { listen 80; server_name atlas.example.ir; return 301 https://$host$request_uri; }
